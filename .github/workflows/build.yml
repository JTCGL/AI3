name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  headless:
    name: Headless Core
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install headless prerequisites
        env:
          AI3_BOOTSTRAP_HEADLESS: "1"
        run: bash scripts/bootstrap.sh

      - name: Configure, build, and test
        env:
          AI3_PRESET: headless-debug
        run: bash scripts/check.sh

  linux-gcc-graphical:
    name: Linux GCC Graphical
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host prerequisites
        run: bash scripts/bootstrap.sh

      - name: Configure, build, and test
        env:
          AI3_PRESET: linux-gcc-debug
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a bash scripts/check.sh
